<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>体验馆展项管控系统</title>

<style>

/* ============ Reset & Base ============ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{

  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;

  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;

  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;

  --green:#16a34a;--green-light:#dcfce7;--yellow:#ca8a04;--yellow-light:#fef9c3;--red:#dc2626;--red-light:#fee2e2;--blue:#2563eb;--blue-light:#dbeafe;

  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 30px rgba(0,0,0,.12);

}

html{font-size:14px}

body{font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif;background:var(--gray-100);color:var(--gray-800);line-height:1.5;-webkit-font-smoothing:antialiased}

button{font-family:inherit;cursor:pointer;border:none;outline:none;font-size:14px}

input,select,textarea{font-family:inherit;font-size:14px;outline:none;border:none}

a{color:var(--primary);text-decoration:none}

/* ============ Layout ============ */

.app{display:flex;min-height:100vh}

.sidebar{width:220px;background:var(--gray-900);color:var(--gray-300);display:flex;flex-direction:column;flex-shrink:0;position:fixed;height:100vh;z-index:100}

.sidebar-brand{padding:20px 24px;font-size:18px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}

.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}

.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:var(--gray-400);cursor:pointer;transition:all .15s;font-size:14px;white-space:nowrap}

.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}

.nav-item.active{color:#fff;background:var(--primary)}

.nav-item svg{flex-shrink:0}

.sidebar-footer{padding:12px 24px;font-size:12px;color:var(--gray-500);border-top:1px solid rgba(255,255,255,.08)}

.main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-height:100vh}

/* ============ Topbar ============ */

.topbar{background:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04);position:sticky;top:0;z-index:50}

.topbar h1{font-size:20px;font-weight:700;color:var(--gray-800)}

.topbar-actions{display:flex;gap:8px;align-items:center}

/* ============ Buttons ============ */

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-weight:500;transition:all .15s;white-space:nowrap}

.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}

.btn-secondary{background:var(--gray-100);color:var(--gray-700)}.btn-secondary:hover{background:var(--gray-200)}

.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}

.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

.btn-ghost{background:transparent;color:var(--gray-600);padding:5px 8px;border-radius:6px}.btn-ghost:hover{background:var(--gray-100)}

.btn svg{display:block}

/* ============ Content ============ */

.content{padding:24px 28px;flex:1}

/* Stats Cards */

.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}

.stat-card{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}

.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}

.stat-card.active{border-color:var(--primary)}

.stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px;font-weight:500}

.stat-value{font-size:28px;font-weight:800;color:var(--gray-800)}

.stat-card.warning .stat-value{color:var(--yellow)}

.stat-card.danger .stat-value{color:var(--red)}

/* Filter Bar */

.filter-bar{background:#fff;border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.filter-group{display:flex;align-items:center;gap:6px}

.filter-label{font-size:13px;color:var(--gray-500);white-space:nowrap}

.filter-select,.filter-input{padding:7px 12px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;color:var(--gray-700);transition:border-color .15s}

.filter-select:focus,.filter-input:focus{border-color:var(--primary)}

.filter-input{width:240px}

.filter-spacer{flex:1}

.tag-active{background:var(--primary-light);color:var(--primary-dark);font-size:12px;padding:2px 8px;border-radius:4px;margin-left:4px}

/* View Toggle */

.view-toggle{display:flex;border:1px solid var(--gray-300);border-radius:8px;overflow:hidden}

.view-toggle button{padding:7px 12px;background:#fff;color:var(--gray-500);transition:all .15s}

.view-toggle button.active{background:var(--primary);color:#fff}

/* ============ Card View ============ */

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.exhibit-card{background:#fff;border-radius:var(--radius);padding:0;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;overflow:hidden;border-top:3px solid var(--gray-300)}

.exhibit-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}

.exhibit-card.status-online{border-top-color:var(--green)}

.exhibit-card.status-pending{border-top-color:var(--yellow)}

.exhibit-card.status-offline{border-top-color:var(--red)}

.exhibit-card.status-removed{border-top-color:var(--gray-400)}

.exhibit-card.status-dev{border-top-color:var(--blue)}

.card-header{padding:14px 18px 10px}

.card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}

.card-title{font-size:15px;font-weight:700;color:var(--gray-800);flex:1}

.card-id{font-size:11px;color:var(--gray-400);font-weight:400;white-space:nowrap}

.card-body{padding:0 18px 14px}

.card-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}

.card-row .label{color:var(--gray-500);white-space:nowrap}

.card-row .value{color:var(--gray-700);font-weight:500;text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.card-footer{padding:10px 18px;background:var(--gray-50);border-top:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
.ed-item{font-size:12px;color:var(--gray-600);line-height:1.6;border-bottom:1px dashed var(--gray-200);padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-more{font-size:12px;color:var(--primary);margin-top:4px}

/* Tags */

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}

.tag-green{background:var(--green-light);color:var(--green)}

.tag-yellow{background:var(--yellow-light);color:var(--yellow)}

.tag-red{background:var(--red-light);color:var(--red)}

.tag-gray{background:var(--gray-200);color:var(--gray-600)}

.tag-blue{background:var(--blue-light);color:var(--blue)}

.tag-warn{background:var(--red);color:#fff;animation:pulse 2s ease-in-out infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ============ Table View ============ */

.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}

table{width:100%;border-collapse:collapse;font-size:13px}

thead{background:var(--gray-50);position:sticky;top:0}

th{padding:12px 14px;text-align:left;font-weight:600;color:var(--gray-600);border-bottom:2px solid var(--gray-200);white-space:nowrap}

td{padding:10px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}

tr:hover td{background:var(--gray-50)}

.table-actions{display:flex;gap:4px}

/* ============ Modal ============ */

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}

.modal-overlay.show{display:flex}

.modal{background:#fff;border-radius:14px;width:640px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}

@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}

.modal-title{font-size:18px;font-weight:700;color:var(--gray-800)}

.modal-close{font-size:22px;color:var(--gray-400);background:none;border:none;cursor:pointer;line-height:1;padding:4px}

.modal-close:hover{color:var(--gray-700)}

.modal-body{padding:24px;overflow-y:auto;flex:1}

.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}

/* Form */

.form-group{margin-bottom:16px}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.form-row.three{grid-template-columns:1fr 1fr 1fr}

.form-label{font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;display:block}

.form-label .required{color:var(--red)}

.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;color:var(--gray-700);transition:border-color .15s;font-size:14px}

.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary)}

.form-textarea{resize:vertical;min-height:60px}

.form-hint{font-size:12px;color:var(--gray-400);margin-top:4px}

.form-readonly{background:var(--gray-50);color:var(--gray-500)}

/* ============ Empty State ============ */

.empty{padding:60px 20px;text-align:center;color:var(--gray-400)}

.empty svg{margin-bottom:12px;opacity:.5}

.empty p{font-size:14px}

/* ============ Toast ============ */

.toast{position:fixed;bottom:24px;right:24px;background:var(--gray-800);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:300;box-shadow:var(--shadow-lg);transform:translateY(100px);opacity:0;transition:all .25s}

.toast.show{transform:translateY(0);opacity:1}

.toast.success{background:var(--green)}

.toast.error{background:var(--red)}

/* ============ Confirm Dialog ============ */

.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250;display:none;align-items:center;justify-content:center}

.confirm-overlay.show{display:flex}

.confirm-box{background:#fff;border-radius:14px;padding:28px 32px;max-width:400px;box-shadow:var(--shadow-lg);text-align:center}

.confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--red-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

.confirm-title{font-size:17px;font-weight:700;margin-bottom:6px}

.confirm-msg{font-size:14px;color:var(--gray-500);margin-bottom:22px}

.confirm-actions{display:flex;gap:10px;justify-content:center}

/* ============ Scrollbar ============ */

::-webkit-scrollbar{width:8px;height:8px}

::-webkit-scrollbar-track{background:var(--gray-100)}

::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}

::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

/* Import hint */

.import-hint{font-size:12px;color:var(--gray-400);margin-top:4px}

.file-hidden{display:none}

/* ============ 移动端适配 ============ */

/* 平板适配 (≤1024px) */
@media (max-width:1024px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .stats-row{grid-template-columns:repeat(3,1fr)}
}

/* 手机适配 (≤768px) */
@media (max-width:768px){

  /* 布局：侧边栏改底部导航 */
  .app{display:block}
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    width:100%;height:auto;flex-direction:row;
    border-top:1px solid rgba(255,255,255,.08);
    padding:0;z-index:100;
  }
  .sidebar-brand{display:none}
  .sidebar-nav{
    flex:1;display:flex;flex-direction:row;
    padding:0;overflow-x:auto;
  }
  .nav-item{
    flex:1;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:8px 4px;font-size:11px;white-space:nowrap;
    min-width:60px;
  }
  .nav-item svg{width:18px;height:18px}
  .nav-item span{font-size:10px;line-height:1.2}
  .nav-item:hover{background:rgba(255,255,255,.06)}
  .nav-item.active{background:transparent;color:#fff;border-top:2px solid #fff;padding-top:6px}
  .sidebar-footer{display:none}

  /* 主区域 */
  .main{margin-left:0;padding-bottom:60px}
  html{font-size:13px}

  /* 顶栏 */
  .topbar{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .topbar h1{font-size:17px}
  .topbar-actions{gap:6px;flex-wrap:wrap}
  .topbar-actions .btn{padding:6px 10px;font-size:12px;gap:4px}
  .topbar-actions .btn svg{width:14px;height:14px}

  /* 内容区 */
  .content{padding:14px}

  /* 统计卡片 */
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat-card{padding:12px 14px}
  .stat-label{font-size:11px}
  .stat-value{font-size:22px}

  /* 筛选栏 */
  .filter-bar{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
  .filter-group{width:100%}
  .filter-select,.filter-input{width:100%}
  .filter-label{font-size:12px}
  .filter-spacer{display:none}
  .view-toggle{align-self:center}

  /* 卡片网格：单列 */
  .card-grid{grid-template-columns:1fr;gap:12px}
  .card-row .value{max-width:160px}

  /* 展项数据卡片预览 */
  .ed-item{white-space:normal}

  /* 弹窗全屏化 */
  .modal-overlay{align-items:stretch}
  .modal{
    width:100%;max-width:100%;max-height:100vh;
    border-radius:0;height:100vh;
  }
  .modal-header{padding:16px}
  .modal-title{font-size:16px}
  .modal-body{padding:16px}
  .modal-footer{padding:12px 16px;gap:8px}
  .modal-footer .btn{flex:1;justify-content:center}

  /* 表单单列 */
  .form-row{grid-template-columns:1fr !important;gap:0}
  .form-group{margin-bottom:12px}
  .form-input,.form-select,.form-textarea{font-size:16px}

  /* 表格横向滚动 */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* 确认弹窗 */
  .confirm-box{max-width:90%;padding:20px}

  /* Toast 居中底部 */
  .toast{left:50%;right:auto;bottom:70px;transform:translateX(-50%) translateY(100px);max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* 详情弹窗内容优化 */
  #detailBody{font-size:13px}
  #detailBody div[style*="grid-template-columns"]{grid-template-columns:1fr !important;gap:8px 0 !important}

  /* 数据统计页内联网格强制单列 */
  #content [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}
  #content [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr) !important}

}

/* 小屏手机 (≤480px) */
@media (max-width:480px){
  html{font-size:12px}
  .topbar h1{font-size:16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .stat-value{font-size:20px}
  .nav-item{min-width:50px}
  .nav-item span{font-size:9px}
}

</style>

</head>

<body>

<div class="app">

  <!-- ============ Sidebar ============ -->

  <aside class="sidebar">

    <div class="sidebar-brand">体验馆展项管控</div>

    <nav class="sidebar-nav" id="nav">

      <div class="nav-item active" data-page="dashboard" title="展项总览">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

        <span>展项台账</span>

      </div>

      <div class="nav-item" data-page="warning" title="超期预警">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

        <span>超期预警</span>

      </div>

      <div class="nav-item" data-page="exhibitData" title="展项数据">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/><path d="M3 20h18"/></svg>

        <span>展项数据</span>

      </div>

      <div class="nav-item" data-page="update" title="更新记录">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>

        <span>更新记录</span>

      </div>

      <div class="nav-item" data-page="stats" title="数据统计">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

        <span>数据统计</span>

      </div>

    </nav>

    <div class="sidebar-footer">本地数据 · 自动保存</div>

  </aside>

  <!-- ============ Main ============ -->

  <div class="main">

    <!-- Topbar -->

    <header class="topbar">

      <h1 id="pageTitle">展项台账</h1>

      <div class="topbar-actions">

        <input type="file" id="importFile" class="file-hidden" accept=".json">

        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

          导入

        </button>

        <button class="btn btn-secondary btn-sm" onclick="exportData()">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

          导出

        </button>

        <button class="btn btn-danger btn-sm" onclick="confirmClearAll()">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>

          清空数据

        </button>

        <button class="btn btn-primary btn-sm" onclick="onAddBtnClick()">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          <span id="addBtnText">新增展项</span>

        </button>

      </div>

    </header>

    <!-- Content -->

    <div class="content" id="content">

      <!-- Dynamic content here -->

    </div>

  </div>

</div>

<!-- ============ Modal: Add/Edit ============ -->

<div class="modal-overlay" id="editModal">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title" id="modalTitle">新增展项</div>

      <button class="modal-close" onclick="closeModal()">&times;</button>

    </div>

    <div class="modal-body">

      <input type="hidden" id="editId">

      <div class="form-row">

        <div class="form-group">

          <label class="form-label">展项编号 <span class="required">*</span></label>

          <input type="text" class="form-input" id="f_id" placeholder="如 ZXD001" onblur="genIdIfEmpty()">

        </div>

        <div class="form-group">

          <label class="form-label">展项名称 <span class="required">*</span></label>

          <input type="text" class="form-input" id="f_name" placeholder="如 AI智能客服体验">

        </div>

      </div>

      <div class="form-row three">

        <div class="form-group">

          <label class="form-label">归属部门类型 <span class="required">*</span></label>

          <select class="form-select" id="f_depttype" onchange="onDeptTypeChange()">

            <option value="能力部门">能力部门</option>

            <option value="行业部门">行业部门</option>

          </select>

        </div>

        <div class="form-group">

let appData = [];

let updateData = [];

let exhibitData = [];

let currentPage = 'dashboard';

let currentView = 'card'; // card | table

let filterStatus = '';    // 状态筛选

let filterDeptType = '';  // 部门类型筛选

let filterDept = '';      // 部门名称筛选

let filterCategory = '';  // 类别筛选

let filterKeyword = '';   // 关键词搜索

let statFilter = '';      // 统计卡片点击筛选

let updateFilter = '';    // 更新状态筛选

// ============ 初始化 ============

function init() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {

    try { appData = JSON.parse(saved); } catch(e) { appData = [...SAMPLE_DATA]; }

  } else {

    appData = [...SAMPLE_DATA];

    saveData();

  }

  // 加载更新记录

  const savedUp = localStorage.getItem(UPDATE_KEY);

  if (savedUp) { try { updateData = JSON.parse(savedUp); } catch(e) { updateData = []; } }

  else { updateData = [...SAMPLE_UPDATE]; saveUpdate(); }

  // 加载展项数据

  const savedEd = localStorage.getItem(EXHIBITDATA_KEY);

  if (savedEd) { try { exhibitData = JSON.parse(savedEd); } catch(e) { exhibitData = []; } }

  else { exhibitData = [...SAMPLE_EXHIBIT_DATA]; saveExhibitData(); }

  // 导航绑定

  document.querySelectorAll('.nav-item').forEach(item => {

    item.addEventListener('click', () => {

      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      item.classList.add('active');

      currentPage = item.dataset.page;

      statFilter = '';

      updateFilter = '';

      // 顶栏按钮文本切换

      const addText = document.getElementById('addBtnText');

      if (currentPage === 'exhibitData') addText.textContent = '新增数据';

      else if (currentPage === 'update') addText.textContent = '登记更新';

      else addText.textContent = '新增展项';

      render();

    });

  });

  // 导入文件监听

  document.getElementById('importFile').addEventListener('change', handleImport);

  render();

}

function saveData() {

  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

}

function saveUpdate() {

  localStorage.setItem(UPDATE_KEY, JSON.stringify(updateData));

}

function saveExhibitData() {

  localStorage.setItem(EXHIBITDATA_KEY, JSON.stringify(exhibitData));

}

// ============ 日期/预警计算 ============

function daysSince(dateStr) {

  if (!dateStr) return null;

  const d = new Date(dateStr);

  const today = new Date();

  today.setHours(0,0,0,0);

  d.setHours(0,0,0,0);

  return Math.floor((today - d) / 86400000);

}

function getUpdateStatus(item) {

  if (item.status === '下线') return { text: '下线', class: 'tag-gray' };

  if (item.status === '新增') return { text: '新增', class: 'tag-blue' };

  const days = daysSince(item.updateDate);

  if (days === null) return { text: '未登记', class: 'tag-yellow' };

  if (days > 90) return { text: '超期预警', class: 'tag-warn' };

  if (days > 60) return { text: '即将到期', class: 'tag-yellow' };

  return { text: '正常', class: 'tag-green' };

}

function getStatusTag(status) {

  const map = {

    '在线': 'tag-green','下线': 'tag-gray','新增': 'tag-blue'

  };

  return `<span class="tag ${map[status] || 'tag-gray'}">${status}</span>`;

}

function getStatusClass(status) {

  const map = {'在线':'online','下线':'removed','新增':'dev'};

  return 'status-' + (map[status] || '');

}

// ============ 过滤 ============

function getFilteredData() {

  let result = [...appData];

  // 页面级筛选

  if (currentPage === 'warning') {

    result = result.filter(item => {

      const us = getUpdateStatus(item);

      return us.text === '超期预警' || us.text === '即将到期';

    });

  }

  // 统计卡片筛选

  if (statFilter) {

    if (statFilter === 'online') result = result.filter(i => i.status === '在线');

    else if (statFilter === 'new') result = result.filter(i => i.status === '新增');

    else if (statFilter === 'offline') result = result.filter(i => i.status === '下线');

    else if (statFilter === 'warning') {

      result = result.filter(i => {

        const us = getUpdateStatus(i);

        return us.text === '超期预警' || us.text === '即将到期';

      });

    }

  }

  // 条件筛选

  if (filterStatus) result = result.filter(i => i.status === filterStatus);

  if (filterDeptType) result = result.filter(i => i.deptType === filterDeptType);

  if (filterDept) result = result.filter(i => i.dept.includes(filterDept));

  if (filterCategory) result = result.filter(i => i.category === filterCategory);

  if (filterKeyword) {

    const kw = filterKeyword.toLowerCase();

    result = result.filter(i =>

      (i.name||'').toLowerCase().includes(kw) ||

      (i.id||'').toLowerCase().includes(kw) ||

      (i.dept||'').toLowerCase().includes(kw) ||

      (i.owner||'').toLowerCase().includes(kw) ||

      (i.location||'').toLowerCase().includes(kw) ||

      (i.desc||'').toLowerCase().includes(kw)

    );

  }

  return result;

}

// 获取部门列表（按筛选的部门类型联动过滤）

function getDeptList() {

  if (filterDeptType && DEPT_OPTIONS[filterDeptType]) {

    return DEPT_OPTIONS[filterDeptType].slice().sort();

  }

  const depts = [...new Set(appData.map(i => i.dept).filter(Boolean))];

  return depts.sort();

}

// ============ 渲染 ============

function render() {

  const titles = { dashboard: '展项台账', warning: '超期预警', stats: '数据统计', exhibitData: '展项数据', update: '更新记录' };

  document.getElementById('pageTitle').textContent = titles[currentPage] || '展项台账';

  if (currentPage === 'stats') {

    renderStatsPage();

    return;

  }

  if (currentPage === 'exhibitData') {

    renderExhibitDataPage();

    return;

  }

  if (currentPage === 'update') {

    renderUpdatePage();

    return;

  }

  const content = document.getElementById('content');

  const data = getFilteredData();

  // 统计卡片

  const total = appData.length;

  const onlineCount = appData.filter(i => i.status === '在线').length;

  const newCount = appData.filter(i => i.status === '新增').length;

  const offlineCount = appData.filter(i => i.status === '下线').length;

  const warningCount = appData.filter(i => {

    const us = getUpdateStatus(i);

    return us.text === '超期预警' || us.text === '即将到期';

  }).length;

  let html = '';

  // 统计卡片行

  html += `<div class="stats-row">

    <div class="stat-card ${statFilter==='total'?'active':''}" onclick="toggleStatFilter('total')">

      <div class="stat-label">展项总数</div>

      <div class="stat-value">${total}</div>

    </div>

    <div class="stat-card ${statFilter==='online'?'active':''}" onclick="toggleStatFilter('online')">

      <div class="stat-label">在线运行</div>

      <div class="stat-value" style="color:var(--green)">${onlineCount}</div>

    </div>

    <div class="stat-card ${statFilter==='new'?'active':''}" onclick="toggleStatFilter('new')">

      <div class="stat-label">新增</div>

      <div class="stat-value" style="color:var(--blue)">${newCount}</div>

    </div>

    <div class="stat-card ${statFilter==='offline'?'active':''}" onclick="toggleStatFilter('offline')">

      <div class="stat-label">下线</div>

      <div class="stat-value">${offlineCount}</div>

    </div>

    <div class="stat-card ${statFilter==='warning'?'active':''} warning" onclick="toggleStatFilter('warning')">

      <div class="stat-label">需关注</div>

      <div class="stat-value">${warningCount}</div>

    </div>

  </div>`;

  // 筛选栏

  html += `<div class="filter-bar">

    <div class="filter-group">

      <span class="filter-label">状态</span>

      <select class="filter-select" id="fl_status" onchange="onFilterChange('status', this.value)">

        <option value="">全部</option>

        <option value="在线" ${filterStatus==='在线'?'selected':''}>在线</option>

        <option value="下线" ${filterStatus==='下线'?'selected':''}>下线</option>

        <option value="新增" ${filterStatus==='新增'?'selected':''}>新增</option>

      </select>

    </div>

    <div class="filter-group">

      <span class="filter-label">部门类型</span>

      <select class="filter-select" id="fl_depttype" onchange="onFilterChange('deptType', this.value)">

        <option value="">全部</option>

        <option value="能力部门" ${filterDeptType==='能力部门'?'selected':''}>能力部门</option>

        <option value="行业部门" ${filterDeptType==='行业部门'?'selected':''}>行业部门</option>

      </select>

    </div>

    <div class="filter-group">

      <span class="filter-label">归属部门</span>

      <select class="filter-select" id="fl_dept" onchange="onFilterChange('dept', this.value)">

        <option value="">全部</option>

        ${getDeptList().map(d => `<option value="${d}" ${filterDept===d?'selected':''}>${d}</option>`).join('')}

      </select>

    </div>

    <div class="filter-group">

      <span class="filter-label">类别</span>

      <select class="filter-select" id="fl_cat" onchange="onFilterChange('category', this.value)">

        <option value="">全部</option>

        <option value="互动体验" ${filterCategory==='互动体验'?'selected':''}>互动体验</option>

        <option value="数据大屏" ${filterCategory==='数据大屏'?'selected':''}>数据大屏</option>

        <option value="视频展示" ${filterCategory==='视频展示'?'selected':''}>视频展示</option>

        <option value="实物展示" ${filterCategory==='实物展示'?'selected':''}>实物展示</option>

        <option value="PPT" ${filterCategory==='PPT'?'selected':''}>PPT</option>

        <option value="其他" ${filterCategory==='其他'?'selected':''}>其他</option>

      </select>

    </div>

    <div class="filter-group">

      <input type="text" class="filter-input" id="fl_kw" placeholder="搜索编号/名称/负责人..." value="${filterKeyword}" oninput="onFilterChange('keyword', this.value)">

    </div>

    <div class="filter-spacer"></div>

    <div class="view-toggle">

      <button class="${currentView==='card'?'active':''}" onclick="switchView('card')">卡片</button>

      <button class="${currentView==='table'?'active':''}" onclick="switchView('table')">列表</button>

    </div>

  </div>`;

  // 数据展示

  if (data.length === 0) {

    html += `<div class="empty">

      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>

      <p>没有符合条件的展项</p>

    </div>`;

  } else {

    if (currentView === 'card') {

      html += '<div class="card-grid">';

      data.forEach(item => { html += renderCard(item); });

      html += '</div>';

    } else {

      html += renderTable(data);

    }

  }

  content.innerHTML = html;

}

// ============ 卡片渲染 ============

// ============ 统计页面 ============

function renderStatsPage() {

  const content = document.getElementById('content');

  const total = appData.length;

  const byStatus = {};

  const byDeptType = {};

  const byDept = {};

  const byCategory = {};

  const warningItems = [];

  appData.forEach(item => {

    byStatus[item.status] = (byStatus[item.status]||0) + 1;

    byDeptType[item.deptType] = (byDeptType[item.deptType]||0) + 1;

    byDept[item.dept] = (byDept[item.dept]||0) + 1;

    byCategory[item.category] = (byCategory[item.category]||0) + 1;

    const us = getUpdateStatus(item);

    if (us.text === '超期预警') warningItems.push(item);

  });

  const maxDept = Math.max(...Object.values(byDept), 1);

  const maxStatus = Math.max(...Object.values(byStatus), 1);

  const maxCat = Math.max(...Object.values(byCategory), 1);

  let html = '';

  // Summary cards

  html += `<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">

    <div class="stat-card"><div class="stat-label">展项总数</div><div class="stat-value">${total}</div></div>

    <div class="stat-card"><div class="stat-label">在线运行</div><div class="stat-value" style="color:var(--green)">${byStatus['在线']||0}</div></div>

    <div class="stat-card warning"><div class="stat-label">超期预警</div><div class="stat-value">${warningItems.length}</div></div>

    <div class="stat-card"><div class="stat-label">下线</div><div class="stat-value" style="color:var(--red)">${byStatus['下线']||0}</div></div>

  </div>`;

  // 图表区域

  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">`;

  // 按状态分布

  html += `<div style="background:#fff;border-radius:10px;padding:20px;box-shadow:var(--shadow)">

    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">按展项状态分布</h3>

    ${Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`

      <div style="margin-bottom:12px">

        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">

          <span>${k}</span><span style="font-weight:700">${v}</span>

        </div>

        <div style="background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden">

          <div style="width:${(v/maxStatus*100)}%;height:100%;background:${k==='在线'?'var(--green)':k==='下线'?'var(--gray-400)':'var(--blue)'};border-radius:4px;transition:width .3s"></div>

        </div>

      </div>`).join('')}

  </div>`;

  // 按部门分布

  html += `<div style="background:#fff;border-radius:10px;padding:20px;box-shadow:var(--shadow)">

    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">按归属部门分布（Top 10）</h3>

    ${Object.entries(byDept).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`

      <div style="margin-bottom:12px">

        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">

          <span>${esc(k)}</span><span style="font-weight:700">${v}</span>

        </div>

        <div style="background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden">

          <div style="width:${(v/maxDept*100)}%;height:100%;background:var(--primary);border-radius:4px;transition:width .3s"></div>

        </div>

      </div>`).join('')}

  </div>`;

  // 按类别分布

  html += `<div style="background:#fff;border-radius:10px;padding:20px;box-shadow:var(--shadow)">

    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">按展项类别分布</h3>

    ${Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`

      <div style="margin-bottom:12px">

        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">

          <span>${k}</span><span style="font-weight:700">${v}</span>

        </div>

        <div style="background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden">

          <div style="width:${(v/maxCat*100)}%;height:100%;background:var(--blue);border-radius:4px;transition:width .3s"></div>

        </div>

      </div>`).join('')}

  </div>`;

  // 部门类型对比

  html += `<div style="background:#fff;border-radius:10px;padding:20px;box-shadow:var(--shadow)">

    <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">部门类型对比</h3>

    ${Object.entries(byDeptType).map(([k,v])=>`

      <div style="margin-bottom:12px">

        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">

          <span>${k}</span><span style="font-weight:700">${v}</span>

        </div>

        <div style="background:var(--gray-100);border-radius:4px;height:8px;overflow:hidden">

          <div style="width:${(v/Math.max(Object.values(byDeptType)))*100}%;height:100%;background:${k==='能力部门'?'var(--primary)':'var(--green)'};border-radius:4px;transition:width .3s"></div>

        </div>

      </div>`).join('')}

  </div>`;

  html += `</div>`;

  // 超期预警列表

  if (warningItems.length > 0) {

    html += `<div style="background:#fff;border-radius:10px;padding:20px;box-shadow:var(--shadow)">

      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px;color:var(--red)">超期预警展项（${warningItems.length}个）</h3>

      <div class="table-wrap" style="box-shadow:none">

        <table>

          <thead><tr><th>编号</th><th>展项名称</th><th>归属部门</th><th>最后更新</th><th>距今天数</th><th>负责人</th></tr></thead>

          <tbody>

            ${warningItems.map(item=>{

              const d = daysSince(item.updateDate);

              return `<tr style="cursor:pointer" onclick="openDetail('${item.id}')">

                <td>${esc(item.id)}</td><td><strong>${esc(item.name)}</strong></td>

                <td>${esc(item.dept||'')}</td><td>${esc(item.updateDate||'')}</td>

                <td style="text-align:center;color:var(--red);font-weight:700">${d}</td>

                <td>${esc(item.owner||'')}</td>

              </tr>`;

            }).join('')}

          </tbody>

        </table>

      </div>

    </div>`;

  }

  content.innerHTML = html;

}

// ============ 筛选操作 ============

function onFilterChange(type, val) {

  switch(type) {

    case 'status': filterStatus = val; break;

    case 'deptType': filterDeptType = val; filterDept = ''; break;

    case 'dept': filterDept = val; break;

    case 'category': filterCategory = val; break;

    case 'keyword': filterKeyword = val; break;

  }

  render();

}

function switchView(view) {

  currentView = view;

  render();

}

function toggleStatFilter(key) {

  if (key === 'total') { statFilter = ''; } else { statFilter = statFilter === key ? '' : key; }

  render();

}

// ============ 新增/编辑 ============

function genIdIfEmpty() {

  const idField = document.getElementById('f_id');

  if (!idField.value && !document.getElementById('editId').value) {

    const maxNum = appData.reduce((max, item) => {

      const m = (item.id||'').match(/(\d+)$/);

      return m ? Math.max(max, parseInt(m[1])) : max;

    }, 0);

    idField.value = 'ZXD' + String(maxNum + 1).padStart(3, '0');

  }

}

// 部门类型联动：根据类型填充归属部门下拉选项

const DEPT_OPTIONS = {

  '能力部门': ['云省分公司','AI与大数据中心','产品运营中心','云网运营中心','数智省分公司'],

  '行业部门': ['工业BU','交通住建BU','教育BU','金融BU','农业文旅BU','汽车BU','商客BU','数字政府BU','卫健BU','政法应急BU']

};

function onDeptTypeChange() {

  const dt = document.getElementById('f_depttype').value;

  const sel = document.getElementById('f_dept');

  const options = DEPT_OPTIONS[dt] || [];

  sel.innerHTML = '<option value="">请选择归属部门</option>' + options.map(d => `<option value="${d}">${d}</option>`).join('');

}

// 编辑时回填已选值

function onDeptTypeChangeWithValue(val) {

  onDeptTypeChange();

  if (val) document.getElementById('f_dept').value = val;

}

function openAddModal() {

  document.getElementById('editId').value = '';

  document.getElementById('modalTitle').textContent = '新增展项';

  // 清空表单

  ['f_id','f_name','f_location','f_owner','f_contact','f_tech_contact','f_desc','f_remark'].forEach(id => {

    document.getElementById(id).value = '';

  });

  // 默认值

  document.getElementById('f_depttype').value = '能力部门';

  document.getElementById('f_category').value = '互动体验';

  document.getElementById('f_status').value = '在线';

  onDeptTypeChange();

  const today = new Date().toISOString().slice(0,10);

  document.getElementById('f_online_date').value = today;

  document.getElementById('f_update_date').value = today;

  // 自动生成编号

  genIdIfEmpty();

  document.getElementById('editModal').classList.add('show');

  document.getElementById('f_name').focus();

}

function openEditModal(id) {

  const item = appData.find(i => i.id === id);

  if (!item) return showToast('未找到展项', 'error');

  document.getElementById('editId').value = item.id;

  document.getElementById('modalTitle').textContent = '编辑展项 — ' + item.name;

  document.getElementById('f_id').value = item.id;

  document.getElementById('f_id').classList.add('form-readonly');

  document.getElementById('f_id').readOnly = true;

  document.getElementById('f_name').value = item.name || '';

  document.getElementById('f_depttype').value = item.deptType || '能力部门';

  onDeptTypeChangeWithValue(item.dept || '');

  document.getElementById('f_category').value = item.category || '互动体验';

  document.getElementById('f_status').value = item.status || '在线';

  document.getElementById('f_online_date').value = item.onlineDate || '';

  document.getElementById('f_update_date').value = item.updateDate || '';

  document.getElementById('f_location').value = item.location || '';

  document.getElementById('f_owner').value = item.owner || '';

  document.getElementById('f_contact').value = item.contact || '';

  document.getElementById('f_tech_contact').value = item.techContact || '';

  document.getElementById('f_desc').value = item.desc || '';

  document.getElementById('f_remark').value = item.remark || '';

  onDeptTypeChange();

  document.getElementById('editModal').classList.add('show');

}

function closeModal() {

  document.getElementById('editModal').classList.remove('show');

  document.getElementById('f_id').readOnly = false;

  document.getElementById('f_id').classList.remove('form-readonly');

}

function saveExhibit() {

  const editId = document.getElementById('editId').value;

  const id = document.getElementById('f_id').value.trim();

  const name = document.getElementById('f_name').value.trim();

  if (!id) return showToast('请填写展项编号', 'error');

  if (!name) return showToast('请填写展项名称', 'error');

  // 编号唯一性检查

  const exists = appData.find(i => i.id === id && i.id !== editId);

  if (exists) return showToast('展项编号已存在，请使用其他编号', 'error');

  const data = {

    id: id,

    name: name,

    deptType: document.getElementById('f_depttype').value,

    dept: document.getElementById('f_dept').value.trim(),

    category: document.getElementById('f_category').value,

    status: document.getElementById('f_status').value,

    onlineDate: document.getElementById('f_online_date').value,

    updateDate: document.getElementById('f_update_date').value,

    location: document.getElementById('f_location').value.trim(),

    owner: document.getElementById('f_owner').value.trim(),

    contact: document.getElementById('f_contact').value.trim(),

    techContact: document.getElementById('f_tech_contact').value.trim(),

    desc: document.getElementById('f_desc').value.trim(),

    remark: document.getElementById('f_remark').value.trim(),

  };

  if (editId) {

    // 编辑

    const idx = appData.findIndex(i => i.id === editId);

    if (idx > -1) { appData[idx] = data; }

    showToast('展项已更新', 'success');

  } else {

    // 新增

    appData.push(data);

    showToast('展项已新增', 'success');

  }

  saveData();

  closeModal();

  render();

}

function openDetail(id) {

  const item = appData.find(i => i.id === id);

  if (!item) return;

  const us = getUpdateStatus(item);

  const days = daysSince(item.updateDate);

  document.getElementById('detailTitle').textContent = item.name + ' — 详情';

  document.getElementById('detailBody').innerHTML = `

    <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">

      ${getStatusTag(item.status)}

      <span class="tag ${us.class}">${us.text}</span>

      <span class="tag tag-blue">${esc(item.category||'')}</span>

      <span class="tag tag-gray">${esc(item.deptType||'')}</span>

    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px">

      ${detailRow('展项编号', item.id)}

      ${detailRow('展项名称', item.name)}

      ${detailRow('归属部门类型', item.deptType)}

      ${detailRow('归属部门', item.dept)}

      ${detailRow('展项类别', item.category)}

      ${detailRow('展项状态', item.status)}

      ${detailRow('上线日期', item.onlineDate)}

      ${detailRow('最后更新日期', item.updateDate)}

      ${detailRow('距今天数', days!==null?days+'天':'-', days!==null&&days>90?'color:var(--red);font-weight:700':'')}

      ${detailRow('更新状态', us.text)}

      ${detailRow('展项位置', item.location)}

      ${detailRow('负责人', item.owner)}

      ${detailRow('联系方式', item.contact)}

      ${detailRow('技术联系人', item.techContact)}

    </div>

    <div style="margin-top:16px">

      <div style="font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px">内容介绍</div>

      <div style="font-size:14px;color:var(--gray-700);padding:12px;background:var(--gray-50);border-radius:8px;white-space:pre-wrap;word-break:break-word;line-height:1.6">${esc(item.desc||'无')}</div>

    </div>

    <div style="margin-top:12px">

      <div style="font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px">备注</div>

      <div style="font-size:14px;color:var(--gray-700);padding:12px;background:var(--gray-50);border-radius:8px">${esc(item.remark||'无')}</div>

    </div>

  `;

  document.getElementById('detailModal').classList.add('show');

}

function detailRow(label, value, style='') {

  return `<div>

    <div style="font-size:12px;color:var(--gray-500);margin-bottom:2px">${label}</div>

    <div style="font-size:14px;color:var(--gray-800);font-weight:500;${style}">${esc(value||'-')}</div>

  </div>`;

}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
  const eb = document.getElementById('detailEditBtn');
  if (eb) { eb.style.display = ''; eb.onclick = editFromDetail; }
}

function editFromDetail() {

  const editId = document.getElementById('editId') || {value:''};

  // 从详情获取ID

  const title = document.getElementById('detailTitle').textContent;

  closeDetail();

  // 从appData找到对应的item

  const item = appData.find(i => (i.name + ' — 详情') === title);

  if (item) openEditModal(item.id);

}

// ============ 删除 ============

function confirmDelete(id) {

  const item = appData.find(i => i.id === id);

  if (!item) return;

  document.getElementById('confirmMsg').textContent = `确定要删除「${item.name}」（${item.id}）吗？此操作不可撤销。`;

  document.getElementById('confirmOverlay').classList.add('show');

  document.getElementById('confirmOkBtn').onclick = () => {

    appData = appData.filter(i => i.id !== id);

    saveData();

    closeConfirm();

    showToast('展项已删除', 'success');

    render();

  };

}

function closeConfirm() {

  document.getElementById('confirmOverlay').classList.remove('show');

}

function renderExhibitDataPage() {

    data = data.filter(i =>
      (i.name||'').toLowerCase().includes(kw) ||
      (i.dept||'').toLowerCase().includes(kw) ||
      (i.dataItems||[]).some(d => String(d).toLowerCase().includes(kw))
    );
  }

  // 统计
  const total = exhibitData.length;
  const totalItems = exhibitData.reduce((s,i) => s + (i.dataItems||[]).length, 0);
  const deptSet = [...new Set(exhibitData.map(i => i.dept).filter(Boolean))].sort();
  const lastUpdate = exhibitData[0] ? exhibitData[0].updateTime : '';

  let html = '';

  html += `<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">

function genUpdateId() {

  const maxNum = updateData.reduce((max, item) => {

    const m = (item.id||'').match(/(\d+)$/);

    return m ? Math.max(max, parseInt(m[1])) : max;

  }, 0);

  return 'JL' + String(maxNum + 1).padStart(3, '0');

}

function renderUpdatePage() {

  const content = document.getElementById('content');

  const ongoing = updateData.filter(i => i.status === '进行中').length;

  let html = '';

  // 统计卡片

  html += `<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">

    <div class="stat-card ${updateFilter==='进行中'?'active':''} warning" onclick="setUpdateFilter('进行中')">

      <div class="stat-label">进行中</div><div class="stat-value">${ongoing}</div>

    </div>

    <div class="stat-card ${updateFilter==='待启动'?'active':''}" onclick="setUpdateFilter('待启动')">

      <div class="stat-label">待启动</div><div class="stat-value">${pending}</div>

    </div>

    <div class="stat-card ${updateFilter==='已完成'?'active':''}" onclick="setUpdateFilter('已完成')">

      <div class="stat-label">已完成</div><div class="stat-value" style="color:var(--green)">${done}</div>

    </div>

  </div>`;

  html += `<div class="filter-bar">

    <div class="filter-group">

      <span class="filter-label">更新状态</span>

      <select class="filter-select" onchange="setUpdateFilter(this.value)">

        <option value="">全部</option>

        <option value="待启动" ${updateFilter==='待启动'?'selected':''}>待启动</option>

        <option value="进行中" ${updateFilter==='进行中'?'selected':''}>进行中</option>

        <option value="已完成" ${updateFilter==='已完成'?'selected':''}>已完成</option>

        <option value="已逾期" ${updateFilter==='已逾期'?'selected':''}>已逾期</option>

        <option value="已取消" ${updateFilter==='已取消'?'selected':''}>已取消</option>

    </div>

  </div>`;

  } else {

    html += `<div class="table-wrap"><table>

      <thead><tr>

        <th>记录编号</th><th>展项名称</th><th>归属部门</th><th>更新类型</th>

        <th>更新内容</th><th>版本变化</th><th>计划日期</th><th>完成日期</th>

        <th>状态</th><th>执行人</th><th>操作</th>

      </tr></thead>

      <tbody>

        ${data.map(item => {

          const statusMap = {'待启动':'tag-gray','进行中':'tag-yellow','已完成':'tag-green','已逾期':'tag-red','已取消':'tag-gray'};

          const verText = (item.verOld||'-') + ' → ' + (item.verNew||'-');

          return `<tr style="cursor:pointer" onclick="openUpdateDetail('${item.id}')">

            <td>${esc(item.id)}</td>

            <td><strong>${esc(item.exhibitName||'')}</strong></td>

            <td>${esc(item.dept||'')}</td>

            <td>${esc(item.type||'')}</td>

            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item.desc||'')}</td>

            <td>${esc(verText)}</td>

            <td><span class="tag ${statusMap[item.status]||'tag-gray'}">${esc(item.status||'')}</span></td>

function saveUpdate() {

  const editId = document.getElementById('up_id').value;

  const exhibitId = document.getElementById('up_exhibit_id').value;

  const desc = document.getElementById('up_desc').value.trim();

  const planDate = document.getElementById('up_plan_date').value;

  if (!exhibitId) return showToast('请选择关联展项', 'error');

  if (!desc) return showToast('请填写更新内容描述', 'error');

  if (!planDate) return showToast('请填写计划更新日期', 'error');

  const exhibit = appData.find(i => i.id === exhibitId);

  const status = document.getElementById('up_status').value;

  const doneDate = document.getElementById('up_done_date').value;

  const data = {

    id: editId || genUpdateId(),

    exhibitId: exhibitId,

    exhibitName: exhibit ? exhibit.name : document.getElementById('up_exhibit_name').value,

    dept: exhibit ? exhibit.dept : document.getElementById('up_dept').value,

    type: document.getElementById('up_type').value,

    status: status,

    desc: desc,

    verOld: document.getElementById('up_ver_old').value.trim(),

    verNew: document.getElementById('up_ver_new').value.trim(),

    planDate: planDate,

    doneDate: doneDate,

    executor: document.getElementById('up_executor').value.trim(),

    verifier: document.getElementById('up_verifier').value.trim(),

    remark: document.getElementById('up_remark').value.trim(),

  };

  if (editId) {

    const idx = updateData.findIndex(i => i.id === editId);

    if (idx > -1) updateData[idx] = data;

    showToast('更新记录已保存', 'success');

  } else {

    updateData.unshift(data);

    showToast('更新记录已登记', 'success');

  }

  // 如果状态为已完成，自动刷新总台账的"最后更新日期"

  if (status === '已完成' && doneDate && exhibit) {

    exhibit.updateDate = doneDate;

    saveData();

    showToast('已同步更新展项台账的"最后更新日期"', 'success');

  }

  saveUpdate();

  closeUpdateModal();

  render();

}

// ============ 导出 ============
function exportData() {
  const allData = {
    exhibits: appData,
    updates: updateData,
    exhibitData: exhibitData,
    exportDate: new Date().toISOString(),
  };
  const dataStr = JSON.stringify(allData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `展项管控数据备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出', 'success');
}

// ============ 导入 ============
function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const raw = JSON.parse(event.target.result);
      // 兼容多种格式
      let exhibits = null, updates = null, edData = null;
      if (Array.isArray(raw)) {
        exhibits = raw;
      } else {
        if (raw.exhibits) exhibits = raw.exhibits;
        if (raw.updates) updates = raw.updates;
        if (raw.exhibitData) edData = raw.exhibitData;
        if (!exhibits && !updates && !edData) throw new Error('数据格式不正确');
      }
      // 校验展项台账
      if (exhibits) {
        const valid = exhibits.every(i => i.id && i.name);
        if (!valid) throw new Error('展项台账数据缺少必填字段（编号、名称）');
      }
      const exCnt = exhibits ? exhibits.length : 0;
      const upCnt = updates ? updates.length : 0;
      const edCnt = edData ? edData.length : 0;
      const totalCount = exCnt + upCnt + edCnt;
      const parts = [];
      if (exhibits) parts.push(`展项台账${exCnt}条`);
      if (edData) parts.push(`展项数据${edCnt}组`);
      if (updates) parts.push(`更新记录${upCnt}条`);
      const detail = parts.join('、');

      const doImport = () => {
        if (exhibits) { appData = exhibits; saveData(); }
        if (updates) { updateData = updates; saveUpdate(); }
        if (edData) { exhibitData = edData; saveExhibitData(); }
      };

      const hasExisting = appData.length > 0 || exhibitData.length > 0;
      if (hasExisting) {
        document.getElementById('confirmTitle').textContent = '导入数据';
        document.getElementById('confirmMsg').textContent = `导入后将覆盖现有数据（${detail}），确定继续吗？`;
        document.getElementById('confirmOverlay').classList.add('show');
        document.getElementById('confirmOkBtn').textContent = '确认导入';
        document.getElementById('confirmOkBtn').onclick = () => {
          doImport();
          closeConfirm();
          document.getElementById('confirmOkBtn').textContent = '确认删除';
          showToast(`成功导入 ${totalCount} 条数据`, 'success');
          render();
        };
      } else {
        doImport();
        showToast(`成功导入 ${totalCount} 条数据`, 'success');
        render();
      }
    } catch(err) {
      showToast('导入失败：' + err.message, 'error');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function onAddBtnClick() {
  if (currentPage === 'exhibitData') openAddExhibitDataModal();
  else if (currentPage === 'update') openAddUpdateModal();
  else openAddModal();
}

// ============ Toast ============

function showToast(msg, type='') {

  const toast = document.getElementById('toast');

  toast.textContent = msg;

  toast.className = 'toast show ' + type;

  setTimeout(() => toast.classList.remove('show'), 2500);

}

// ============ 工具 ============

function esc(str) {

  if (str === null || str === undefined) return '';

  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

}
